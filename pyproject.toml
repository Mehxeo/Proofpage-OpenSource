[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpage"
version = "0.5.0"
description = "Local evidence collection and reviewed dataset preparation"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
google = ["google-auth-oauthlib>=1.2,<2", "keyring>=25,<26"]
mcp-http = ["mcp>=1.30,<2", "PyJWT[crypto]>=2.10,<3"]
media = ["pypdfium2==5.14.0", "rapidocr==3.10.0", "onnxruntime>=1.20,<2", "Pillow>=11,<13"]
hosted = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "stripe>=15.6,<16"]
test = ["httpx>=0.27,<1"]
render = ["playwright>=1.48,<2"]

[project.scripts]
proofpage = "proofpage.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["proofpage"]

[tool.setuptools.package-data]
proofpage = ["static/*", "static/fonts/*", "skills/proofpage/SKILL.md"]
