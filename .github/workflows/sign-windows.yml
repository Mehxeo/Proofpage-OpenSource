name: sign-windows-release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require signing configuration
        shell: pwsh
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
        run: |
          foreach ($name in 'CLIENT','TENANT','SUBSCRIPTION','ENDPOINT','ACCOUNT','PROFILE') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing signing setting: $name" }
          }
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python scripts/build_desktop.py
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\build\desktop\Proofpage
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify executable signatures
        shell: pwsh
        run: |
          foreach ($file in 'build/desktop/Proofpage/Proofpage.exe','build/desktop/Proofpage/Proofpage-MCP.exe') {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw "Invalid or untimestamped signature: $file" }
          }
      - run: python scripts/desktop_smoke.py
      - run: python scripts/build_desktop.py --package-only
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: dist/Proofpage-*-windows-*.zip
