name: test-and-package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[hosted,test,media]'
      - run: python -m unittest discover -s tests -v
      - run: node tests/browser_companion_test.cjs
      - run: node tests/preferences_test.cjs
      - run: python -m compileall -q proofpage
      - run: for file in proofpage/static/*.js; do node --check "$file"; done
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: proofpage-python-${{ matrix.python }}
          path: dist/*.whl
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proofpage:test .
      - run: python3 scripts/container_smoke.py
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python scripts/bundle.py
      - run: python scripts/install_smoke.py
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python -m unittest discover -s tests -p test_launcher.py -v
      - run: python scripts/build_desktop.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/desktop_smoke.py
      - if: runner.os != 'Linux'
        run: python scripts/desktop_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/Proofpage-*.zip
            dist/Proofpage-*.tar.gz
